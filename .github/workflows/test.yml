name: Nasdaq-100 Crash Agent

on:
  workflow_dispatch:
  schedule:
    # 21:30 UTC, Mon-Fri = shortly after the Nasdaq close (20:00-21:00
    # UTC depending on EST/EDT). GitHub Actions cron is UTC only and
    # schedules can be delayed a few minutes during high load - the
    # script re-checks live prices when it runs, so a short delay is
    # harmless.
    - cron: "30 21 * * 1-5"

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Nasdaq-100 scanner
        env:
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scanner/main.py

